[package]
name = "whykey"
version = "1.0.2"
edition = "2024"
rust-version = "1.85"
description = "Explain where a key combination is handled"
license = "MIT"
readme = "README.md"
repository = "https://github.com/agustinrojas1/whykey"
homepage = "https://github.com/agustinrojas1/whykey"
documentation = "https://github.com/agustinrojas1/whykey#readme"
keywords = ["keyboard", "terminal", "hyprland", "readline", "diagnostics"]
categories = ["command-line-utilities", "os::linux-apis"]
exclude = ["nvim.log", "eval", "eval/**", "REFACTORING_PLAN.md"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
