name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # x86_64 glibc binary linked against glibc 2.28 symbols, plus fully static
  # musl binaries for x86_64 and aarch64.
  TARGETS: x86_64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Verify Git tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$cargo_version" ]]; then
            echo "Git tag version ($tag_version) does not match Cargo.toml version ($cargo_version)" >&2
            exit 1
          fi
      - name: Check generated release documentation
        run: |
          python3 tools/generate_support_matrix.py --check
          python3 tools/generate_dependency_provenance.py --check
          python3 tools/generate_crates_readme.py --check
          tools/check_package_versions.sh
      - name: Install cargo-zigbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install ziglang==0.17.0 cargo-zigbuild==0.23.4
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      - name: Build release binaries
        run: |
          cargo zigbuild --locked --release --target x86_64-unknown-linux-gnu.2.28
          cargo zigbuild --locked --release --target x86_64-unknown-linux-musl
          cargo zigbuild --locked --release --target aarch64-unknown-linux-musl
      - name: Check the glibc floor and static linking
        shell: bash
        run: |
          set -euo pipefail
          newest=$(objdump -T target/x86_64-unknown-linux-gnu/release/whykey \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
          echo "newest glibc symbol version: $newest"
          test "$(printf '%s\nGLIBC_2.28\n' "$newest" | sort -V | tail -n 1)" = GLIBC_2.28
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            binary="target/$target/release/whykey"
            file "$binary"
            # musl binaries are static-pie: no interpreter, no NEEDED entries.
            if readelf -lW "$binary" | grep -q 'Requesting program interpreter' \
              || readelf -dW "$binary" | grep -q '(NEEDED)'; then
              echo "$binary is dynamically linked" >&2
              exit 1
            fi
          done
      - name: Run the binaries on old and musl distributions
        shell: bash
        run: |
          set -euo pipefail
          run() {
            local platform=$1 image=$2 target=$3 output errors
            errors=$(mktemp)
            # Pull first so the run's stderr holds only the binary's own messages.
            docker pull -q --platform "$platform" "$image" >/dev/null
            output=$(docker run --rm --pull never --platform "$platform" \
              -v "$PWD/target/$target/release:/b:ro" "$image" /b/whykey --version 2>"$errors")
            echo "$image ($platform, $target): $output"
            if [[ -s "$errors" ]]; then
              cat "$errors" >&2
              exit 1
            fi
            [[ "$output" == "whykey ${GITHUB_REF_NAME#v}" ]]
          }
          run linux/amd64 ubuntu:20.04 x86_64-unknown-linux-gnu
          run linux/amd64 debian:oldstable x86_64-unknown-linux-gnu
          run linux/amd64 alpine:latest x86_64-unknown-linux-musl
          run linux/arm64 alpine:latest aarch64-unknown-linux-musl
      - name: Assemble release archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          tools/assemble_source_archive.sh "$GITHUB_WORKSPACE"
          for target in $TARGETS; do
            root="whykey-${version}-${target}"
            mkdir -p "$root"
            install -m 0755 "target/${target}/release/whykey" "$root/whykey"
            install -m 0644 README.md SPEC.md CHANGELOG.md SUPPORT_MATRIX.md ADAPTER_INVENTORY.md DEPENDENCY_PROVENANCE.md support-matrix.json DEFECT_REGISTER.md LICENSE whykey.1 "$root/"
            cp -a extensions packaging tools "$root/"
            tar -czf "${root}.tar.gz" "$root"
            sha256sum "${root}.tar.gz" > "${root}.tar.gz.sha256"
          done
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            whykey-*.tar.gz
            whykey-*.tar.gz.sha256

  # Publishes the tagged source to crates.io through Trusted Publishing: the
  # crates.io crate settings trust this repository's release.yml, so the job
  # gets a short-lived token from OIDC instead of a stored API token.
  crates-io:
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Points the agustinrojas1/homebrew-tap formula at the new musl archives.
  # HOMEBREW_TAP_DEPLOY_KEY is a write deploy key of that repository only.
  homebrew:
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: agustinrojas1/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap
      - name: Update and push the formula
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          tools/update_homebrew_formula.sh "$version" homebrew-tap/Formula/whykey.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "whykey ${version}"
          git push

  # Attaches whykey-obs.tar to the release and runs the service of the
  # home:agustinrojas/whykey OBS package, which downloads that bundle from the
  # latest release and rebuilds for every distribution. OBS_RUNSERVICE_TOKEN
  # is an OBS token that can only trigger that service.
  obs:
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install dpkg-source
        run: sudo apt-get install -y --no-install-recommends dpkg-dev
      - name: Build the OBS bundle
        run: tools/prepare_obs.sh "${GITHUB_REF_NAME#v}" obs
      - name: Attach the bundle to the release
        run: gh release upload "$GITHUB_REF_NAME" obs/whykey-obs.tar --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Trigger the OBS service
        run: >-
          curl -fsS -X POST -H "Authorization: Token $OBS_TOKEN"
          "https://api.opensuse.org/trigger/runservice?project=home:agustinrojas&package=whykey"
        env:
          OBS_TOKEN: ${{ secrets.OBS_RUNSERVICE_TOKEN }}
