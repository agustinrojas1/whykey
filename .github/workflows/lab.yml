name: Reality lab

# Runs every lab/scenarios scenario against real compositors, window managers,
# hotkey daemons, settings stores and shells in the Fedora lab image, and fails
# when whykey's verdict disagrees with what the programs actually did.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build lab image
        uses: docker/build-push-action@v6
        with:
          context: lab
          tags: whykey-lab
          load: true
          cache-from: type=gha,scope=whykey-lab
          cache-to: type=gha,mode=max,scope=whykey-lab
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build whykey
        run: cargo build --release --locked
      - name: Run lab scenarios
        run: python3 lab/run.py -j "$(nproc)"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-results
          path: lab/results.json
          if-no-files-found: warn
