name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: Linux gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check generated support matrix
        run: python3 tools/generate_support_matrix.py --check
      - name: Check adapter fixture gate
        run: tools/check_adapter_gate.sh
      - name: Check dependency provenance
        run: python3 tools/generate_dependency_provenance.py --check
      - name: Check defect register is packaged documentation
        run: test -s DEFECT_REGISTER.md && test -s ADAPTER_INVENTORY.md && test -s DEPENDENCY_PROVENANCE.md
      - name: Check native recipes carry release documentation
        run: |
          for script in debian/rules tools/arch_package_smoke.sh tools/assemble_source_archive.sh tools/check_package_versions.sh; do
            test -x "$script"
          done
          for recipe in debian/rules packaging/whykey.spec packaging/PKGBUILD packaging/whykey.nix; do
            grep -q DEPENDENCY_PROVENANCE.md "$recipe"
            grep -q SUPPORT_MATRIX.md "$recipe"
          done
      - name: Check package versions
        run: tools/check_package_versions.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run extension tests
        run: python3 extensions/tests/run_all.py
      - name: Run tests
        run: cargo test --all-targets --all-features
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build release
        run: cargo build --release
      - name: Build and test the offline source release
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tools/assemble_source_archive.sh "$RUNNER_TEMP"
          archive="$RUNNER_TEMP/whykey-${version}-source.tar.gz"
          (cd "$RUNNER_TEMP" && sha256sum -c "$(basename "$archive").sha256")
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/whykey-${version}"
          cargo build --release --locked --offline
          cargo test --all-targets --locked --offline
      - name: Validate package
        run: cargo package --allow-dirty --locked
      - name: Install package
        run: cargo install --path . --locked --root "$RUNNER_TEMP/whykey-install"
      - name: Smoke test installed binary
        run: |
          "$RUNNER_TEMP/whykey-install/bin/whykey" --version
      - name: Run installed binary in a clean environment
        run: bash tools/clean_install_smoke.sh "$RUNNER_TEMP/whykey-install/bin/whykey"

  msrv:
    runs-on: ubuntu-latest
    name: Linux MSRV gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0
          components: clippy
      - name: Check the declared minimum Rust version
        run: cargo check --locked
      - name: Run tests with the minimum compiler
        run: cargo test --all-targets --locked
      - name: Run Clippy with the minimum compiler
        run: cargo clippy --all-targets --locked -- -D warnings
