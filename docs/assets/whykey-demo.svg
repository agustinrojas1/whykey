<svg xmlns="http://www.w3.org/2000/svg" width="820" height="428" viewBox="0 0 820 428" role="img" aria-labelledby="title desc">
  <title id="title">whykey super+return</title>
  <desc id="desc">A terminal running whykey super+return on a Hyprland desktop. whykey reports that Hyprland is configured to consume the shortcut, names the action (Terminal), the evidence tier (live query), and the configuration file and line that bind it.</desc>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; font-size: 14px; fill: #e6edf3; white-space: pre; }
    .b { font-weight: 700; }
    .h { fill: #56d4dd; }
    .d { fill: #8b949e; }
    .p { fill: #7ee787; }
    .k { fill: #ffa657; }
  </style>
  <rect x="0.5" y="0.5" width="819" height="427" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="819" height="34" rx="10" fill="#161b22"/>
  <rect x="0.5" y="24" width="819" height="11" fill="#161b22"/>
  <line x1="0" y1="34.5" x2="820" y2="34.5" stroke="#30363d"/>
  <circle cx="22" cy="17.5" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="17.5" r="6" fill="#febc2e"/>
  <circle cx="62" cy="17.5" r="6" fill="#28c840"/>
  <text x="410" y="22" text-anchor="middle" class="t d" style="font-size:12px">whykey — Hyprland</text>
  <text class="t" xml:space="preserve">
    <tspan x="24" y="64"><tspan class="p">$</tspan> whykey <tspan class="k">super+return</tspan></tspan>
    <tspan x="24" y="94" class="b">Super+Return<tspan class="h" style="font-weight:400"> · Inspect</tspan></tspan>
    <tspan x="24" y="124" class="b">Hyprland is configured to consume the shortcut.</tspan>
    <tspan x="24" y="154" class="h">Effect</tspan>
    <tspan x="24" y="174">  The configured consumer stops this shortcut before later layers can handle it.</tspan>
    <tspan x="24" y="204" class="h">Relevant layers (configuration)</tspan>
    <tspan x="24" y="224">  Hyprland — Configured to stop: Terminal <tspan class="d">[live query]</tspan></tspan>
    <tspan x="24" y="244">      action __lua 268; source</tspan>
    <tspan x="24" y="264">      /usr/share/omarchy/default/hypr/bindings/applications.lua:2</tspan>
    <tspan x="24" y="294" class="d">Technical detail: use --verbose for the complete route and raw evidence.</tspan>
    <tspan x="24" y="334"><tspan class="p">$</tspan> whykey listen   <tspan class="d"># or press the shortcut and let whykey watch it</tspan></tspan>
    <tspan x="24" y="364" class="h">Capture ready · Hyprland</tspan>
    <tspan x="24" y="384">  pass-through observation; normal shortcut actions can still run.</tspan>
    <tspan x="24" y="404">  Waiting for input.</tspan>
  </text>
</svg>
