  <text class="t" xml:space="preserve">
    <tspan x="24" y="64"><tspan class="p">$</tspan> whykey <tspan class="k">super+return</tspan></tspan>
    <tspan x="24" y="90"><tspan class="b">Super+Return</tspan>                                           <tspan class="d">Hyprland · Wayland · bash</tspan></tspan>
    <tspan x="24" y="110"></tspan>
    <tspan x="24" y="130"><tspan class="r">✕</tspan> <tspan class="b">Hyprland takes Super+Return and runs Terminal.</tspan></tspan>
    <tspan x="24" y="150">  Nothing after Hyprland receives Super+Return.</tspan>
    <tspan x="24" y="170"></tspan>
    <tspan x="24" y="190"><tspan class="h">Route</tspan></tspan>
    <tspan x="24" y="210">  1  Remapper      <tspan class="p">↓</tspan>  none detected</tspan>
    <tspan x="24" y="230">  2  Hyprland      <tspan class="r">✕</tspan>  Terminal                                        <tspan class="d">live query</tspan></tspan>
    <tspan x="24" y="250">  3  Terminal      <tspan class="d">·</tspan>  not reached</tspan>
    <tspan x="24" y="270">  4  TTY driver    <tspan class="d">·</tspan>  not reached</tspan>
    <tspan x="24" y="290">  5  Input method  <tspan class="d">·</tspan>  not reached</tspan>
    <tspan x="24" y="310">  6  Multiplexer   <tspan class="d">·</tspan>  not reached</tspan>
    <tspan x="24" y="330">  7  Shell         <tspan class="d">·</tspan>  not reached</tspan>
    <tspan x="24" y="350"></tspan>
    <tspan x="24" y="370"><tspan class="h">Bound in</tspan></tspan>
    <tspan x="24" y="390">  /usr/share/omarchy/default/hypr/bindings/applications.lua:2</tspan>
    <tspan x="24" y="410">  __lua 268 (Lua dispatcher; whykey does not execute it)</tspan>
    <tspan x="24" y="430"></tspan>
