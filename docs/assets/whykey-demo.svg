    <tspan x="24" y="470">            default. Not observed: run `whykey listen` to watch it.</tspan>
    <tspan x="24" y="490"></tspan>
    <tspan x="24" y="510"><tspan class="h">More</tspan>  whykey super+return -v</tspan>
