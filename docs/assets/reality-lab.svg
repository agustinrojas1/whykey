<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" role="img" aria-labelledby="t d" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
<style>@media (prefers-color-scheme: dark){[fill="#1f2328"]{fill:#e6edf3}[stroke="#1f2328"]{stroke:#e6edf3}[fill="#656d76"]{fill:#8b949e}[stroke="#656d76"]{stroke:#8b949e}[fill="#8c959f"]{fill:#6e7681}[stroke="#8c959f"]{stroke:#6e7681}[fill="#9a6700"]{fill:#d29922}[stroke="#9a6700"]{stroke:#d29922}[fill="#d0d7de"]{fill:#30363d}[stroke="#d0d7de"]{stroke:#30363d}[fill="#f6f8fa"]{fill:#161b22}[stroke="#f6f8fa"]{stroke:#161b22}[fill="#ffffff"]{fill:#0d1117}[stroke="#ffffff"]{stroke:#0d1117}}</style>
<title id="t">How a reality-lab scenario runs</title>
<desc id="d">A scenario starts the real program with a test config and sends it a synthetic key press; an independent oracle records whether the bind ran or a test window received the key; the scenario runs whykey KEY --json; the scenario passes only if whykey's verdict matches the oracle's ground truth.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/></marker></defs>
<rect width="820" height="420" rx="12" fill="#ffffff"/>
<line x1="110" y1="68" x2="110" y2="398" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="26.0" y="20" width="168" height="48" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="110" y="49" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">Scenario</text>
<line x1="330" y1="68" x2="330" y2="398" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="246.0" y="20" width="168" height="48" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="330" y="41" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">Real program</text>
<text x="330" y="58" text-anchor="middle" font-size="11" fill="#656d76">(Sway, KWin, tmux…)</text>
<line x1="540" y1="68" x2="540" y2="398" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="456.0" y="20" width="168" height="48" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="540" y="49" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">Independent oracle</text>
<line x1="720" y1="68" x2="720" y2="398" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="636.0" y="20" width="168" height="48" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="720" y="49" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">whykey</text>
<line x1="116" y1="112" x2="324" y2="112" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="220.0" y="98" text-anchor="middle" font-size="12" fill="#1f2328">start with a test config</text>
<circle cx="110" cy="112" r="9" fill="#1f2328"/>
<text x="110" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
<line x1="116" y1="156" x2="324" y2="156" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="220.0" y="142" text-anchor="middle" font-size="12" fill="#1f2328">synthetic key press (virtual or kernel keyboard)</text>
<circle cx="110" cy="156" r="9" fill="#1f2328"/>
<text x="110" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
<line x1="336" y1="200" x2="534" y2="200" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="435.0" y="186" text-anchor="middle" font-size="12" fill="#1f2328">did the bind run? did a test window receive the key?</text>
<circle cx="330" cy="200" r="9" fill="#1f2328"/>
<text x="330" y="204" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
<line x1="116" y1="244" x2="714" y2="244" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="415.0" y="230" text-anchor="middle" font-size="12" fill="#1f2328">whykey KEY --json</text>
<circle cx="110" cy="244" r="9" fill="#1f2328"/>
<text x="110" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
<line x1="714" y1="288" x2="116" y2="288" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="415.0" y="274" text-anchor="middle" font-size="12" fill="#1f2328">verdict</text>
<circle cx="720" cy="288" r="9" fill="#1f2328"/>
<text x="720" y="292" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
<line x1="534" y1="332" x2="116" y2="332" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="325.0" y="318" text-anchor="middle" font-size="12" fill="#1f2328">ground truth</text>
<circle cx="540" cy="332" r="9" fill="#1f2328"/>
<text x="540" y="336" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>
<rect x="50" y="368" width="300" height="30" rx="6" fill="#f6f8fa" stroke="#9a6700"/>
<text x="200.0" y="388" text-anchor="middle" font-size="12" fill="#1f2328">passes only if the verdict matches reality</text>
</svg>
