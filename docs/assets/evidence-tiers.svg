<svg xmlns="http://www.w3.org/2000/svg" width="860" height="140" viewBox="0 0 860 140" role="img" aria-labelledby="t d" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
<style>@media (prefers-color-scheme: dark){[fill="#1f2328"]{fill:#e6edf3}[stroke="#1f2328"]{stroke:#e6edf3}[fill="#656d76"]{fill:#8b949e}[stroke="#656d76"]{stroke:#8b949e}[fill="#8c959f"]{fill:#6e7681}[stroke="#8c959f"]{stroke:#6e7681}[fill="#d0d7de"]{fill:#30363d}[stroke="#d0d7de"]{stroke:#30363d}[fill="#f6f8fa"]{fill:#161b22}[stroke="#f6f8fa"]{stroke:#161b22}[fill="#ffffff"]{fill:#0d1117}[stroke="#ffffff"]{stroke:#0d1117}}</style>
<title id="t">Evidence tiers</title>
<desc id="d">whykey first tries to observe the key itself (whykey listen); when a layer is not observable it asks the running program (compositor IPC, D-Bus, X server grabs, tmux, live shell bindings); when the program cannot be asked it reads configuration files and built-in defaults.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/></marker></defs>
<rect width="860" height="140" rx="12" fill="#ffffff"/>
<rect x="10" y="22" width="240" height="96" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="130.0" y="56.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">1 · Observe</text>
<text x="130.0" y="76.0" text-anchor="middle" font-size="13" fill="#1f2328">capture the key itself</text>
<text x="130.0" y="96.0" text-anchor="middle" font-size="12" fill="#656d76">whykey listen</text>
<line x1="254" y1="70.0" x2="306" y2="70.0" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="280.0" y="46.0" text-anchor="middle" font-size="11" fill="#656d76">not</text>
<text x="280.0" y="60.0" text-anchor="middle" font-size="11" fill="#656d76">observable</text>
<rect x="310" y="22" width="240" height="96" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="430.0" y="56.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">2 · Ask the running program</text>
<text x="430.0" y="76.0" text-anchor="middle" font-size="12" fill="#656d76">compositor IPC · D-Bus · X server grabs</text>
<text x="430.0" y="96.0" text-anchor="middle" font-size="12" fill="#656d76">tmux · live shell bindings</text>
<line x1="554" y1="70.0" x2="606" y2="70.0" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="580.0" y="46.0" text-anchor="middle" font-size="11" fill="#656d76">cannot be</text>
<text x="580.0" y="60.0" text-anchor="middle" font-size="11" fill="#656d76">asked</text>
<rect x="610" y="22" width="240" height="96" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="730.0" y="65.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">3 · Read configuration</text>
<text x="730.0" y="85.0" text-anchor="middle" font-size="12" fill="#656d76">config files · built-in defaults</text>
</svg>
